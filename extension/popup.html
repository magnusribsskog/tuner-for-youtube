<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 290px;
    background: #0f0f0f;
    color: #ccc;
    font-family: monospace;
    font-size: 12px;
  }

  #header {
    background: #1a1a1a;
    border-bottom: 2px solid #ff4757;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #title { font-size: 13px; font-weight: 800; color: #ff4757; }
  #nuke-val { font-size: 11px; color: #888; }
  #nuke-val span { color: white; }

  .section { border-bottom: 1px solid #1a1a1a; padding: 6px 0; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 14px;
  }

  .row-label { display: flex; flex-direction: column; gap: 1px; }
  .row-key   { color: #ccc; font-size: 11px; }
  .row-sub   { color: #555; font-size: 10px; }

  .toggle {
    cursor: pointer; font-size: 10px; padding: 2px 8px;
    border-radius: 4px; font-weight: 700; border: 1px solid;
    background: none; font-family: monospace; white-space: nowrap;
  }
  .toggle.on  { color: #2ed573; border-color: #2ed573; }
  .toggle.off { color: #444;    border-color: #444;    }
  .toggle.disabled { opacity: 0.4; cursor: default; }

  .section-head {
    padding: 6px 14px 2px;
    font-size: 9px;
    color: #444;
    letter-spacing: 1px;
    font-weight: 700;
  }

  #phrase-area { padding: 6px 14px 10px; }
  #phrase-input-row { display: flex; gap: 6px; margin-bottom: 6px; }
  #phrase-input {
    flex: 1; background: #111; border: 1px solid #333; border-radius: 4px;
    color: #ccc; font-family: monospace; font-size: 11px; padding: 3px 7px; outline: none;
  }
  #phrase-add {
    cursor: pointer; font-size: 10px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid #ffa502; color: #ffa502; font-family: monospace; font-weight: 700;
    background: none;
  }
  #phrase-list { display: flex; flex-direction: column; gap: 3px; max-height: 100px; overflow-y: auto; }
  .phrase-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; color: #888;
  }
  .phrase-remove { cursor: pointer; color: #444; padding: 0 2px; }
  .phrase-remove:hover { color: #ff4757; }
  .phrase-empty { font-size: 10px; color: #333; }

  #not-youtube { padding: 18px 14px; color: #555; text-align: center; line-height: 1.7; }

  #diag-status { color: #333; font-size: 10px; font-style: italic; }
  #diag-status.live { color: #555; }
</style>
</head>
<body>
<div id="header">
  <span id="title">☢️ Tuner for YouTube</span>
  <span id="nuke-val">NUKED: <span id="count">—</span></span>
</div>

<div id="main">
  <div class="section">
    <div class="row">
      <div class="row-label">
        <span class="row-key">Extension</span>
        <span class="row-sub" id="ext-status">—</span>
      </div>
      <button class="toggle off" id="btn-ext">—</button>
    </div>
    <div class="row">
      <div class="row-label">
        <span class="row-key">Show log</span>
        <span class="row-sub">In-page nuke log</span>
      </div>
      <button class="toggle off" id="btn-hud">OFF</button>
    </div>
  </div>

  <div class="section" id="filter-section">
    <div class="section-head">FILTERS — session only</div>
  </div>

  <div class="section" id="clown-section">
    <div class="section-head">🤡 CLOWN MODE — session only · auto-off 10m</div>
    <div class="row">
      <div class="row-label">
        <span class="row-key">Send in the clowns</span>
        <span class="row-sub" id="clown-status">the circus is closed</span>
      </div>
      <button class="toggle off" id="btn-clown">OFF</button>
    </div>
    <div class="row" id="clown-opts" style="display:none">
      <button class="toggle off" id="btn-parade">🧠 BRAINROT PARADE</button>
    </div>
  </div>

  <div class="section" id="phrase-section">
    <div class="section-head">CUSTOM PHRASES — persistent</div>
    <div id="phrase-area">
      <div id="phrase-input-row">
        <input id="phrase-input" type="text" placeholder="add phrase…">
        <button id="phrase-add">ADD</button>
      </div>
      <div id="phrase-list"></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="row">
    <span id="diag-status">open popup DevTools to inspect</span>
    <button class="toggle off" id="btn-diag">DIAG</button>
  </div>
</div>

<div id="not-youtube" style="display:none">
  Not on YouTube.<br>Navigate to the homepage<br>to start filtering.
</div>

<script src="popup.js"></script>
</body>
</html>
